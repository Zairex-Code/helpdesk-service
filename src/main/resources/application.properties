# ==============================================================================
# SoftTech Solutions ERP - HelpDesk Reactive Microservice Configuration
# Infrastructure Alignment: ISO/IEC 25010 (Reliability & Security) & CMMI Level 2/3
# Docker Compose Mappings: MongoDB (27018), Redis (6380), Kafka (9095)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. HTTP SERVER & REACTIVE NETTY RUNTIME ENGINE
# ------------------------------------------------------------------------------
quarkus.http.port=8080
quarkus.http.host=0.0.0.0
quarkus.http.read-timeout=30s
quarkus.http.limits.max-body-size=2M
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.headers=accept, authorization, content-type, x-requested-with, x-correlation-id
quarkus.http.cors.methods=GET, POST, PUT, PATCH, DELETE, OPTIONS

# Enterprise Jackson Serialization (ISO-8601 UTC Timestamps & Immutability)
quarkus.jackson.write-dates-as-timestamps=false
quarkus.jackson.serialization-inclusion=non-null
quarkus.jackson.fail-on-empty-beans=false

# ------------------------------------------------------------------------------
# 2. MONGODB REACTIVE PANACHE PERSISTENCE ENGINE (Port 27018)
# ------------------------------------------------------------------------------
quarkus.mongodb.connection-string=${MONGODB_URI:mongodb://helpdesk_admin:helpdesk_secret_password@localhost:27018/helpdesk_db?authSource=admin}
quarkus.mongodb.database=${MONGODB_DATABASE:helpdesk_db}
quarkus.mongodb.max-pool-size=${MONGODB_MAX_POOL_SIZE:100}
quarkus.mongodb.min-pool-size=${MONGODB_MIN_POOL_SIZE:10}
quarkus.mongodb.max-connection-idle-time=60s
quarkus.mongodb.connect-timeout=10s
quarkus.mongodb.server-selection-timeout=10s

# ------------------------------------------------------------------------------
# 3. DISTRIBUTED REDIS REACTIVE CACHE ENGINE (Port 6380)
# ------------------------------------------------------------------------------
quarkus.redis.hosts=${REDIS_URI:redis://:redis_secret_password@localhost:6380}
quarkus.redis.timeout=5s
quarkus.redis.max-pool-size=${REDIS_MAX_POOL_SIZE:50}
quarkus.redis.max-pool-waiting=100
quarkus.redis.connect-timeout=5s
quarkus.redis.client-type=standalone

# ------------------------------------------------------------------------------
# 4. APACHE KAFKA REACTIVE MESSAGING (Port 9095 & Outgoing Channel)
# ------------------------------------------------------------------------------
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9095}

# Outgoing Channel: ticket-events-out (SmallRye Reactive Messaging)
mp.messaging.outgoing.ticket-events-out.connector=smallrye-kafka
mp.messaging.outgoing.ticket-events-out.topic=${KAFKA_TICKET_EVENTS_TOPIC:helpdesk.ticket-events.v1}
mp.messaging.outgoing.ticket-events-out.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.ticket-events-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.ticket-events-out.acks=all
mp.messaging.outgoing.ticket-events-out.retries=5
mp.messaging.outgoing.ticket-events-out.retry.backoff.ms=250
mp.messaging.outgoing.ticket-events-out.max.in.flight.requests.per.connection=1
mp.messaging.outgoing.ticket-events-out.enable.idempotence=true

# ------------------------------------------------------------------------------
# 5. SECURITY & JWT ROLE-BASED ACCESS CONTROL (RBAC)
# ------------------------------------------------------------------------------
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION:/publicKey.pem}
mp.jwt.verify.issuer=${JWT_ISSUER:https://auth.softtech.com/oauth2/token}
quarkus.smallrye-jwt.enabled=true
quarkus.security.jaxrs.deny-unannotated-endpoints=false

# ------------------------------------------------------------------------------
# 6. OPENAPI & SWAGGER UI METADATA CONTRACT
# ------------------------------------------------------------------------------
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.path=/q/swagger-ui
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.theme=feeling-blue

# ------------------------------------------------------------------------------
# 7. OBSERVABILITY, HEALTH CHECKS & MDC LOGGING
# ------------------------------------------------------------------------------
quarkus.smallrye-health.root-path=/q/health
quarkus.smallrye-health.liveness-path=/q/health/live
quarkus.smallrye-health.readiness-path=/q/health/ready

quarkus.log.level=INFO
quarkus.log.category."org.softtech".level=DEBUG
quarkus.log.category."org.apache.kafka".level=WARN
quarkus.log.category."org.mongodb.driver".level=WARN
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{2.}] (%t) [CorrelationId: %X{correlationId}] %s%e%n

# ------------------------------------------------------------------------------
# 8. TESTING PROFILE OVERRIDES (%test)
# ------------------------------------------------------------------------------
%test.quarkus.log.level=INFO
%test.quarkus.smallrye-jwt.enabled=false
%test.mp.messaging.outgoing.ticket-events-out.connector=smallrye-in-memory