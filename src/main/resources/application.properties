# ==============================================================================
# SoftTech Solutions - HelpDesk Reactive Microservice
# External dependencies (ports aligned with docker-compose.yaml host mappings)
# ==============================================================================

# Kafka (SmallRye Reactive Messaging)
kafka.bootstrap.servers=localhost:9095

# MongoDB (Reactive Panache)
quarkus.mongodb.connection-string=mongodb://helpdesk_admin:helpdesk_secret_password@localhost:27018/helpdesk_db?authSource=admin

# Redis (Cache-Aside)
quarkus.redis.hosts=redis://:redis_secret_password@localhost:6380

# ----------------------------------------------------------------------------
# Boilerplate codestart (to be replaced by HelpDesk domain)
# ----------------------------------------------------------------------------
mp.messaging.incoming.words-in.auto.offset.reset=earliest
mp.messaging.incoming.words-in.topic=words
mp.messaging.outgoing.words-out.topic=words